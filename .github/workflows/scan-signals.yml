name: scan-signals
on:
  schedule:
    - cron: "5 1 * * *"          # daily, after the 1D close
  workflow_dispatch:
concurrency:
  group: scanner-commit          # serialize all tiers - they share docs/index.html + status.json
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: bars-${{ github.run_id }}
          restore-keys: bars-
      - run: python src/scan.py --tier S      # universe-wide signals feed
      - name: commit and push results
        shell: bash
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"; exit 0
          fi
          git commit -m "scan signals $(date -u +%F_%H:%M)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying in 5s..."; sleep 5
          done
          echo "push failed after 3 attempts"; exit 1
