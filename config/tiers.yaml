# Scanner configuration.
# Tiers differ ONLY for the compression detector. The roofed-RSI divergence
# detector runs on its own fixed D/4H config for every symbol, ungated.

universe:
  crypto:
    source: binance_spot_vision    # data-api.binance.vision (fapi/Bybit both block CI IPs)
    quote: USDT
    top_n_by_volume: 10            # tier A membership is a RULE, not a list
    volume_window_days: 30
    overrides: config/overrides.yaml
  equity:
    source: yfinance
    tickers_file: config/equities.txt

tiers:
  A:                               # top-10 crypto by 30d median volume (majors)
    scan_tf: "4h"                  # primary TF (cluster-correlation returns)
    compression_tfs: ["15m", "1h", "4h"]   # trend-gated noodle compression, each TF
    trend_tfs: ["15m", "1h", "4h", "1d", "1w"]   # majors keep the daily
    divergence_tf: "4h"            # roofed-RSI divergence off the 4H bars
    detectors: [compression, divergence]
  B:                               # all other crypto perps (alts)
    scan_tf: "1h"
    compression_tfs: ["15m", "1h", "4h"]
    trend_tfs: ["15m", "1h", "4h", "12h", "1w"]  # alts: 12H instead of daily
    divergence_tf: "4h"
    detectors: [compression, divergence]
    # NOTE: 15m/1h compression params are PROVISIONAL. See calibrate.py.
  C:                               # equities / ETFs
    scan_tf: "1d"
    compression_tfs: ["1d"]       # 15m/4h omitted for equities (ragged/limited data)
    trend_tfs: ["1h", "1d", "1w"]
    divergence_tf: "1d"
    detectors: [compression, divergence]
  D:                               # tokenized stocks (Binance spot, kept separate)
    scan_tf: "1d"
    confirm_tf: []
    divergence_tf: "1d"
    detectors: [compression, divergence]
  E:                               # commodity futures (Yahoo) - full setup scan
    scan_tf: "1d"
    compression_tfs: ["1d"]
    trend_tfs: ["1h", "1d", "1w"]
    divergence_tf: "1d"
    detectors: [compression, divergence]
  F:                               # real NASDAQ/SPX stocks (Yahoo) behind tier D
    scan_tf: "1d"
    compression_tfs: ["1d"]
    trend_tfs: ["1h", "1d", "1w"]
    divergence_tf: "1d"
    detectors: [compression, divergence]

compression:
  # Noodle-gated squeeze: price riding above the Money Noodle (lower rail =
  # upper band) into a straight-line resistance through swing highs (horizontal
  # preferred, angled accepted, rising highs rejected). Only evaluated when the
  # timeframe's swing-trend is `up` (gate applied in scan.py).
  defaults: &comp_defaults
    ema_fast: 12
    ema_mid: 21
    ema_slow: 35
    atr_len: 20
    slope_lookback: 20
    pivot_left: 5
    pivot_right: 3
    structure_lookback: 60
    above_lookback: 8              # bars whose lows must stay above the noodle lower band
    # --- the setup shape: expansion -> consolidation into the noodle ---
    expansion_lookback: 120       # window to find the prior impulse
    min_expansion_atr: 2.5        # price must have run this far clear of the noodle first
    min_consolidation_bars: 10    # ...and the coil since that peak must be at least this long
    max_now_atr: 1.8              # ...and now be coiled back within this of it
    low_near_noodle_atr: 1.5      # pullback lows must hug the noodle (not drift above)
    # --- the resistance must be a real, capping line ---
    res_points: 3                 # swing highs fitted for the resistance line
    res_flat: 0.015               # resistance slope (ATR/bar): > this rejected (ascending),
                                  #   within +/- = horizontal (preferred), below = descending
    res_max_down_atr: 0.25        # ...but no steeper than this - a near-vertical
                                  #   "resistance" is a bad 2-point fit, not a line.
                                  #   Measured: clean diagonals sit at -0.11..-0.21
    res_poke_atr: 0.3             # no high may exceed the line by more than this
    res_touch_atr: 0.35           # a swing high within this of the line counts as a touch
    min_res_touches: 2            # the line must actually be touched this many times
    max_channel_atr: 3.0          # channel height (resistance - noodle upper) to count as tight
    max_gap_atr: 1.0              # price must be within this of the resistance to be "compressed"
    breakout_range_atr: 1.5       # expansion range needed to call "triggered"
  "15m":
    <<: *comp_defaults
    structure_lookback: 80
  "1h":
    <<: *comp_defaults
    pivot_left: 8                  # PROVISIONAL - not swept
    structure_lookback: 120
  "4h": *comp_defaults
  "1d": *comp_defaults

divergence:
  # Chart TF config. margC/margB are the values you are currently observing on
  # 4H. margC=0.20 (the daily optimum) tested NEGATIVE on 4H, so these do not
  # transfer across timeframe - do not copy them to 1H without a sweep.
  "1d": {roof_hi: 130, roof_lo: 10, osc_len: 21, hurst_len: 60, hurst_mult: 3.0,
         piv_l: 5,  piv_r: 5, marg_c: 0.20, marg_b: 0.10, max_gap: 70}
  "4h": {roof_hi: 130, roof_lo: 10, osc_len: 21, hurst_len: 60, hurst_mult: 3.0,
         piv_l: 25, piv_r: 7, marg_c: 0.02, marg_b: 0.25, max_gap: 70}

ranking:
  # Weights are a STARTING POINT. Fit them properly with the blind-grading
  # harness rather than trusting these.
  compression:
    apex_urgency: 0.30             # lower bars_to_apex scores higher
    ribbon_tightness: 0.25         # tighter channel scores higher
    persistence: 0.15              # higher bars_in_state scores higher
    trend_established: 0.30        # longer-running uptrend behind the coil
  divergence:
    recency: 0.40
    margin_excess: 0.35
    htf_favourable: 0.25           # ranking field ONLY - never a gate
  max_rows: 8
  cluster_correlation: 0.80        # collapse hits above this into best-in-cluster

# Money Noodle (EMA 12/21/35 + ATR band on the 35 line) and the swing-structure
# trend gate. Calmer settings = fewer, higher-conviction trend calls that hold
# through pullbacks (bullish first).
noodle:
  ema_fast: 12
  ema_medium: 21
  ema_slow: 35
  atr_len: 20
  band_mult: 0.0125           # ATR-mode band = atr*band_mult*40 = 0.5*ATR(20)
trend:
  pivot_width: 6              # bars each side for a swing (higher = calmer)
  n_swings: 4                 # swings averaged in the slope fit
  tau: 0.04                   # min ATR-normalised rising-lows slope for an uptrend
  break_k: 1.0                # lower-low must break prior swing low by k*ATR to exit `up`
  timeframes: ["15m", "1h", "4h", "1d", "1w"]

# Universe-wide signals feed (tier S): fresh trend flips + noodle breaks +
# weekly-noodle touches, on the "big deal" timeframes.
signals:
  major_tf: "1d"                # majors, stocks, commodities
  alt_tf: "12h"                 # alt coins are more volatile - 12H not daily
  weekly_tf: "1w"
  fresh_bars: 3                 # only surface events within this many bars

# DSS Bressert confluence, shown as D/W/M columns on every surfaced row.
# Standard Bressert double-smoothed stochastic; values scaled 0-1.
dss:
  stoch_len: 13
  ema_len: 8

output:
  dir: docs                        # per-tier pages a..e.html + index.html
